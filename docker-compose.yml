services:
  postgres:
    image: postgres:15
    container_name: border-value-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: border_user
      POSTGRES_PASSWORD: border_password
      POSTGRES_DB: border_value_db
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - border_value_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U border_user -d border_value_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  border_value_pgdata:
